name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analysis-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test the fixed endpoint contract
        run: |
          python -m unittest discover -s tests -p 'test_analysis.py' -v
          python -m unittest discover -s tests -p 'test_metadata.py' -v
      - name: Compile the package
        run: python -m compileall -q src

  real-data-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[analysis]'
      - name: Test the frozen pipeline contract
        run: python -m unittest discover -s tests -v
      - name: Show scientific software versions
        run: python -c "import mne, numpy, scipy; print(mne.__version__, numpy.__version__, scipy.__version__)"
